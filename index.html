<!doctype html>
<html lang="de-CH">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Parcours Timer</title>
<meta name="description" content="Workout-Timer für Bootcamp und Parcours. Läuft offline, Tablet als Anzeige, Handy als Fernbedienung.">
<meta name="theme-color" content="#F3F2EE">
<meta name="color-scheme" content="light dark">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="icon" href="icons/icon-192.png" type="image/png" sizes="192x192">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Parcours">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="preload" href="fonts/barlow-condensed-700.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="fonts/atkinson-400.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="css/app.css">
<script>
  // Design vor dem ersten Zeichnen setzen (kein Aufblitzen)
  try {
    var t = (JSON.parse(localStorage.getItem('parcours.settings.v1') || '{}').theme) || 'auto';
    var d = t === 'dark' || (t === 'auto' && matchMedia('(prefers-color-scheme: dark)').matches);
    document.documentElement.dataset.theme = d ? 'dark' : 'light';
  } catch (e) { document.documentElement.dataset.theme = 'light'; }
</script>
<script src="vendor/qrcode.min.js" defer></script>
<script type="module" src="js/app.js"></script>
</head>
<body>
  <main id="v-home" class="view"></main>
  <section id="v-preview" class="view" hidden></section>
  <section id="v-editor" class="view" hidden></section>
  <section id="v-picker" class="view picker" hidden></section>
  <section id="v-settings" class="view" hidden></section>
  <section id="v-pair-display" class="view" hidden></section>
  <section id="v-pair-remote" class="view" hidden></section>
  <section id="v-ready" class="view" hidden></section>
  <section id="v-share" class="view" hidden></section>
  <section id="v-share-pick" class="view" hidden></section>
  <section id="v-import" class="view" hidden></section>
  <section id="v-remote" class="view remote" hidden></section>
  <section id="v-run" class="view run" hidden lang="de"></section>
  <noscript><p style="padding:24px;font:18px system-ui">Parcours Timer braucht JavaScript.</p></noscript>
</body>
</html>
